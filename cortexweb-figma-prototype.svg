<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">CortexWeb website builder Figma prototype</title>
  <desc id="desc">Editable SVG design board with login, website builder, template gallery, and profile screens.</desc>
  <defs>
    <linearGradient id="authBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172320"/>
      <stop offset="1" stop-color="#36564a"/>
    </linearGradient>
    <linearGradient id="limeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f36b"/>
      <stop offset="1" stop-color="#b9d84e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172320" flood-opacity=".10"/>
    </filter>
    <style>
      .ink{fill:#172320}.muted{fill:#78827d}.white{fill:#fff}.lime{fill:#d8f36b}.paper{fill:#f7f9f6}.line{stroke:#e5eae5}.label{font:600 12px Manrope,Arial,sans-serif}.small{font:500 10px Manrope,Arial,sans-serif}.body{font:400 13px Manrope,Arial,sans-serif}.heading{font:800 34px Manrope,Arial,sans-serif}.mono{font:500 10px 'DM Mono',monospace}.button{font:700 12px Manrope,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#edf1ed"/>
  <text x="70" y="58" class="mono ink">CORTEXWEB / PRODUCT PROTOTYPE / 2026</text>
  <text x="70" y="92" class="heading ink">Website creation, made personal.</text>

  <!-- Login frame -->
  <g id="login-screen" transform="translate(70 135)">
    <rect width="760" height="500" rx="16" fill="#f5f7f2" filter="url(#shadow)"/>
    <rect width="330" height="500" rx="16" fill="url(#authBg)"/>
    <circle cx="255" cy="145" r="82" fill="#d8f36b" opacity=".9"/>
    <circle cx="105" cy="235" r="150" fill="none" stroke="#8fa999" opacity=".25"/>
    <circle cx="105" cy="235" r="105" fill="none" stroke="#8fa999" opacity=".18"/>
    <text x="44" y="75" font-family="Manrope,Arial,sans-serif" font-size="72" font-weight="800" fill="#d8f36b">C</text>
    <text x="42" y="390" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Build boldly.</text>
    <text x="42" y="424" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="700" fill="#d8f36b">Launch beautifully.</text>
    <text x="42" y="460" class="mono" fill="#aab8af">THE WEBSITE CREATION PLATFORM</text>
    <text x="380" y="55" class="label ink">cortexweb<tspan fill="#9dbb36">.</tspan></text>
    <text x="380" y="112" class="mono" fill="#9dbb36">YOUR CREATIVE WORKSPACE</text>
    <text x="380" y="158" font-family="Manrope,Arial,sans-serif" font-size="37" font-weight="800" fill="#172320">Make the web</text>
    <text x="380" y="198" font-family="Manrope,Arial,sans-serif" font-size="37" font-weight="800" fill="#a4bc45">yours.</text>
    <rect x="380" y="230" width="176" height="36" rx="6" fill="none" stroke="#dce4dc"/>
    <text x="398" y="253" class="button ink">Log in</text>
    <text x="475" y="253" class="button muted">Create account</text>
    <text x="380" y="292" class="small muted">Email address</text>
    <rect x="380" y="302" width="310" height="38" rx="5" fill="#fff" stroke="#d7dfd6"/>
    <text x="394" y="326" class="body muted">you@example.com</text>
    <text x="380" y="366" class="small muted">Password</text>
    <rect x="380" y="376" width="310" height="38" rx="5" fill="#fff" stroke="#d7dfd6"/>
    <text x="394" y="400" class="body muted">Enter your password</text>
    <rect x="380" y="438" width="310" height="40" rx="6" fill="url(#limeBg)"/>
    <text x="490" y="463" text-anchor="middle" class="button ink">Log in  -&gt;</text>
    <text x="0" y="545" class="mono muted">01 / AUTHENTICATION</text>
  </g>

  <!-- Builder frame -->
  <g id="builder-screen" transform="translate(880 135)">
    <rect width="850" height="500" rx="16" fill="#f7f9f6" filter="url(#shadow)"/>
    <rect width="850" height="54" rx="16" fill="#fff"/>
    <rect x="0" y="54" width="185" height="446" fill="#eef3ec"/>
    <text x="24" y="34" class="label ink">cortexweb<tspan fill="#9dbb36">.</tspan></text>
    <circle cx="25" cy="82" r="14" fill="#d8f36b"/>
    <text x="25" y="86" text-anchor="middle" class="small ink">CW</text>
    <text x="48" y="86" class="label ink">My website</text>
    <text x="24" y="132" class="mono muted">SECTIONS</text>
    <rect x="16" y="150" width="153" height="34" rx="6" fill="#d8f36b"/>
    <text x="34" y="172" class="button ink">Inbuilt templates</text>
    <text x="34" y="212" class="label muted">Navbar</text>
    <text x="34" y="242" class="label muted">Hero section</text>
    <text x="34" y="272" class="label muted">Feature cards</text>
    <text x="34" y="302" class="label muted">Contact form</text>
    <text x="34" y="332" class="label muted">Testimonials</text>
    <text x="34" y="362" class="label muted">Footer</text>
    <rect x="205" y="72" width="625" height="39" rx="6" fill="#fff" stroke="#e5eae5"/>
    <text x="225" y="96" class="mono muted">Saved just now</text>
    <text x="495" y="96" class="button muted">Preview</text>
    <rect x="610" y="80" width="92" height="25" rx="5" fill="none" stroke="#dce4dc"/>
    <text x="656" y="97" text-anchor="middle" class="small ink">Profile</text>
    <rect x="710" y="80" width="100" height="25" rx="5" fill="#172320"/>
    <text x="760" y="97" text-anchor="middle" class="small white">Publish site</text>
    <rect x="205" y="128" width="625" height="30" fill="#f1f4f0" stroke="#e5eae5"/>
    <text x="225" y="148" class="small muted">Home</text>
    <text x="270" y="148" class="small muted">About</text>
    <text x="315" y="148" class="small muted">Services</text>
    <text x="380" y="148" class="small muted">Contact</text>
    <rect x="225" y="180" width="585" height="125" rx="8" fill="#e9f1df"/>
    <text x="258" y="224" class="mono muted">YOUR BRAND</text>
    <text x="258" y="260" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" class="ink">Make a memorable</text>
    <text x="258" y="290" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" fill="#8ba52e">first impression.</text>
    <rect x="225" y="325" width="280" height="68" rx="8" fill="#fff" stroke="#e5eae5"/>
    <text x="246" y="352" class="label ink">Everything your audience needs.</text>
    <text x="246" y="375" class="small muted">Flexible content that is easy to edit.</text>
    <rect x="520" y="325" width="290" height="68" rx="8" fill="#172320"/>
    <text x="545" y="352" class="label lime">Ready to publish?</text>
    <text x="545" y="375" class="small" fill="#aab8af">Preview, refine, and launch.</text>
    <rect x="225" y="413" width="585" height="55" rx="8" fill="#172320"/>
    <text x="258" y="447" class="label white">Built with intention.</text>
    <text x="0" y="545" class="mono muted">02 / WEBSITE BUILDER</text>
  </g>

  <!-- Template gallery frame -->
  <g id="templates-screen" transform="translate(70 735)">
    <rect width="1060" height="500" rx="16" fill="#f7f9f6" filter="url(#shadow)"/>
    <text x="42" y="55" class="mono" fill="#9dbb36">CORTEXWEB LIBRARY</text>
    <text x="42" y="102" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="800" class="ink">Inbuilt templates</text>
    <text x="42" y="130" class="body muted">Choose a complete website, then edit every page and section.</text>
    <rect x="730" y="70" width="280" height="36" rx="6" fill="#fff" stroke="#dce4dc"/>
    <text x="748" y="94" class="body muted">Search templates</text>
    <g transform="translate(42 170)">
      <g>
        <rect width="300" height="235" rx="9" fill="#d8f36b" stroke="#b9d84e"/>
        <rect x="16" y="16" width="268" height="138" rx="6" fill="#172320"/>
        <path d="M18 136 L138 38 L282 136" fill="#36564a" opacity=".8"/>
        <text x="32" y="57" class="mono lime">ATELIER</text><text x="32" y="112" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" class="white">Design studio</text>
        <text x="18" y="184" class="label ink">Studio editorial</text><text x="18" y="205" class="small" fill="#536b18">Portfolio and agency - 5 pages</text>
        <rect x="218" y="177" width="64" height="28" rx="5" fill="#172320"/><text x="250" y="195" text-anchor="middle" class="small white">Use</text>
      </g>
      <g transform="translate(320 0)">
        <rect width="300" height="235" rx="9" fill="#dcefe8" stroke="#b6dacc"/>
        <rect x="16" y="16" width="268" height="138" rx="6" fill="#7cba9f"/>
        <circle cx="230" cy="58" r="46" fill="#fff" opacity=".5"/><rect x="32" y="88" width="130" height="18" rx="4" fill="#fff" opacity=".8"/>
        <text x="18" y="184" class="label ink">Real estate</text><text x="18" y="205" class="small" fill="#536b18">Properties and agents - 5 pages</text>
        <rect x="218" y="177" width="64" height="28" rx="5" fill="#172320"/><text x="250" y="195" text-anchor="middle" class="small white">Use</text>
      </g>
      <g transform="translate(640 0)">
        <rect width="300" height="235" rx="9" fill="#ffe0c7" stroke="#f0c49d"/>
        <rect x="16" y="16" width="268" height="138" rx="6" fill="#ed9a67"/>
        <circle cx="220" cy="62" r="38" fill="#172320" opacity=".8"/><rect x="32" y="100" width="180" height="18" rx="4" fill="#fff" opacity=".85"/>
        <text x="18" y="184" class="label ink">Fitness studio</text><text x="18" y="205" class="small" fill="#8f5d3c">Classes and coaching - 5 pages</text>
        <rect x="218" y="177" width="64" height="28" rx="5" fill="#172320"/><text x="250" y="195" text-anchor="middle" class="small white">Use</text>
      </g>
    </g>
    <text x="0" y="545" class="mono muted">03 / TEMPLATE GALLERY - 10 INBUILT STARTERS</text>
  </g>

  <!-- Profile frame -->
  <g id="profile-screen" transform="translate(1170 735)">
    <rect width="560" height="500" rx="16" fill="#fff" filter="url(#shadow)"/>
    <rect width="560" height="118" rx="16" fill="url(#authBg)"/>
    <circle cx="78" cy="78" r="39" fill="#d8f36b"/>
    <text x="78" y="87" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" class="ink">YU</text>
    <text x="140" y="67" class="heading white" font-size="24">Your profile</text>
    <text x="140" y="91" class="small" fill="#aab8af">Creator workspace</text>
    <text x="34" y="158" class="mono" fill="#9dbb36">ACCOUNT DETAILS</text>
    <rect x="34" y="178" width="492" height="42" rx="6" fill="#f7f9f6" stroke="#e5eae5"/><text x="52" y="204" class="body ink">Yuvraj Vaghela</text>
    <rect x="34" y="234" width="492" height="42" rx="6" fill="#f7f9f6" stroke="#e5eae5"/><text x="52" y="260" class="body ink">yuvraj833@gmail.com</text>
    <rect x="34" y="290" width="492" height="62" rx="6" fill="#f1f6e6"/><text x="52" y="316" class="label ink">About the creator</text><text x="52" y="339" class="small muted">Build useful, beautiful websites for real people.</text>
    <rect x="34" y="374" width="235" height="82" rx="8" fill="#f1f6e6"/><text x="52" y="405" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" class="ink">10</text><text x="52" y="430" class="small muted">Projects created</text>
    <rect x="291" y="374" width="235" height="82" rx="8" fill="#172320"/><text x="309" y="405" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" class="lime">3</text><text x="309" y="430" class="small" fill="#aab8af">Published websites</text>
    <text x="0" y="545" class="mono muted">04 / USER PROFILE</text>
  </g>
</svg>